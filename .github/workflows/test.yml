# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Test

on:
  push:
  pull_request:

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        psycopg-package: ["psycopg2", "psycopg"]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.0", "4.1", "4.2", "5.0", "5.1", "5.2", "6.0", "6.1"]
        exclude:
          - python-version: "3.9"
            django-version: "5.0"
          - python-version: "3.9"
            django-version: "5.1"
          - python-version: "3.9"
            django-version: "5.2"
          # Django 6.0+ requires Python 3.12+
          - python-version: "3.9"
            django-version: "6.0"
          - python-version: "3.9"
            django-version: "6.1"
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.10"
            django-version: "6.1"
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"
          # Django 4.0 and 4.1 don't support Python 3.12+
          - python-version: "3.12"
            django-version: "4.0"
          - python-version: "3.12"
            django-version: "4.1"
          - python-version: "3.13"
            django-version: "4.0"
          - python-version: "3.13"
            django-version: "4.1"
          # Django 4.2 and 5.0 don't support Python 3.13
          - python-version: "3.13"
            django-version: "4.2"
          - python-version: "3.13"
            django-version: "5.0"
          - django-version: "4.0"
            psycopg-package: "psycopg"
          - django-version: "4.1"
            psycopg-package: "psycopg"
      max-parallel: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          source "$HOME/.cargo/env"
          # Install main dependencies, dev dependencies, and the specific Django version for the matrix
          # Using -e .[dev] installs the current package in editable mode with dev extras
          uv pip install --system -e .[dev]
          pip install Django==${{ matrix.django-version }}
          pip install ${{ matrix.psycopg-package }}
      - name: Run tests
        run: |
          ./check-lint.sh
          python manage.py test -v 3 --no-input

  test-mysql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        django-version: ["4.2", "5.2", "6.0", "6.1"]

    services:
      mysql:
        # Django 6.1 requires MySQL 8.4+
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv and dependencies
        run: |
          # mysqlclient is built from source
          sudo apt-get update
          sudo apt-get install -y libmysqlclient-dev pkg-config
          curl -LsSf https://astral.sh/uv/install.sh | sh
          source "$HOME/.cargo/env"
          uv pip install --system -e .[dev]
          pip install Django==${{ matrix.django-version }}
          pip install mysqlclient
      - name: Run tests
        env:
          DB_ENGINE: mysql
        run: |
          python manage.py test -v 3 --no-input
